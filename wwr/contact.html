<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting Company to make reservations, ask questions, or send feedback about your rafting adventure.">
    <meta name="author" content="Anthony Agbonoga">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting Company</title>
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="white water rafting company logo" width="100">
        <nav class="nav-buttons">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="company-details">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-grid">
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d45920.81729482811!2d-113.9213192490892!3d45.17603831846985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53a06a2ff2a4db33%3A0x7d87f7d6a599b5a2!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="100%" height="100%" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" title="Company Location Map">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">

                <div class="form-item">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" name="username"
                      placeholder="Enter your full name" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail"
                      placeholder="Enter your email" required>
                </div>

                <div class="form-item purpose-item">
                    <span class="label-text">Message<br>Purpose</span>
                    <div class="radio-options">
                        <label for="general">
                            <input type="radio" name="purpose" id="general" value="general" checked>
                            General Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="form-checkbox">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>

        </section>
        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee-profile1.jpg" alt="Employee Profile" width="150">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-profile2.jpg" alt="Employee Profile" width="150">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-profile3.jpg" alt="Employee Profile" width="150">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 White Water Rafting Co. | Anthony Agbonoga</p>
        <nav class="socialmedia">
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="Linkedin Icon"></a>
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
        </nav>
    </footer>

</body>

</html>
