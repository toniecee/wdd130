<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Basic Quiz Form</title>
</head>

<body>

    <main>

        <h1>✅Basic HTML and CSS Quiz</h1>

        <form>

            <div class="quiz-item">
                <label for="q1"><span class="q-num">1.</span> What does the acronym CSS stand
                    for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="quiz-item">
                <label for="q2"><span class="q-num">2.</span> How are id and class attributes
                    selected in
                    CSS?</label>
                <textarea id="q2" name="q2" rows="5"></textarea>
            </div>

            <div class="quiz-item">
                <label for="q3"><span class="q-num">3.</span> Which of the following is a valid CSS
                    comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="a">A. &lt;!-- This is a comment --&gt;</option>
                    <option value="b">B. /* This is a comment */ </option>
                    <option value="c">C. // This is a comment </option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4"><span class="q-num">4.</span> What is the bottom margin given this
                    declaration?</label>
                <code class="box">Margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>

        </form>

    </main>

</body>

</html>
